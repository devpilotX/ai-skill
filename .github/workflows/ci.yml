name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the scripts target, 3.14 guards against future breakage.
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: python3 tools/run_tests.py

      - name: Validate skills and agents
        run: python3 tools/validate_skills.py

      - name: Agents are in sync with their sources
        run: python3 tools/build_agents.py --check

      - name: Build distributable zips
        run: bash tools/build_dist.sh

      - name: Upload zips
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-skill-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
